<svg xmlns="http://www.w3.org/2000/svg" viewBox="104 104 500 500" width="709" height="709" role="img" aria-label="Nature Walks Sri Lanka">
  <!--
    The site icon: the hummingbird on a forest disc.

    The same mark as `public/logo.svg` (a #024E2A disc with the bird in warm
    white), so the tab, the header and the social card all read as one brand.
    The bird alone, green on nothing, is how the artwork arrived; at 16px it
    is nearly invisible against a dark browser tab strip, which is why it sits
    on the disc rather than standing on its own.

    The `viewBox` is the artwork's own bounding box (x 145 to 563, y 131 to
    577, centred on 354,354) squared off to 500 units, so the bird fills the
    frame instead of floating inside the 709-unit canvas it was traced into.
    The two colours are the forest and warm-white custom properties set in
    `app/globals.css`.

    `app/favicon.ico` is generated from this file at 16/32/48px. Regenerate it
    whenever this changes, so the two never disagree.

    Note for editors: an XML comment may not contain two consecutive hyphens,
    so CSS custom properties cannot be written literally in here.
  -->
